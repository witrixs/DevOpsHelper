# /etc/apache2/sites-available/devopshelper.conf
# 1) a2enmod proxy proxy_http headers rewrite ssl
# 2) поправить ServerName
# 3) a2ensite devopshelper && systemctl reload apache2
# 4) certbot --apache -d your.domain

<VirtualHost *:80>
    ServerName helper.rafaello.cc

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/devopshelper-error.log
    CustomLog ${APACHE_LOG_DIR}/devopshelper-access.log combined
</VirtualHost>
